# Refreshes the Lines pages (/lines/, /hockey/lines/) with no manual work.
# Runs jobs/lines/run.py, then commits ONLY data/lines_*.json and new jobs/lines/state/ date files
# back to the branch it ran on. A commit to main redeploys GitHub Pages. If nothing changed, nothing is committed.
name: Lines data

on:
  schedule:
    # Hourly 15:05-07:05 UTC = 11:05 AM-3:05 AM EDT (10:05 AM-2:05 AM EST). GitHub can start scheduled runs late.
    - cron: "5 15-23 * * *"
    - cron: "5 0-7 * * *"
    # Early morning, 10:40 UTC = 6:40 AM EDT / 5:40 AM EST: store last night's final box scores
    # so streaks and "last 10" include them, and roll the page over to the new day's slate.
    - cron: "40 10 * * *"
  workflow_dispatch: {}
  push:
    # test runs while the feature is on its own branch (cron only ever runs on the default branch)
    branches: [lines]
    paths: ["jobs/lines/**", ".github/workflows/lines.yml"]

permissions:
  contents: write

concurrency:
  group: lines-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}     # the branch tip now, not the commit that triggered the run
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build, validate, commit and push (data files only)
        # run.py never overwrites a file with bad data: on an API failure it keeps the last good file and exits 1.
        # If the branch moved while we ran (another run, or the owner pushed), we reset to it and rebuild on top,
        # instead of rebasing generated files.
        run: |
          BR="${GITHUB_REF_NAME}"
          git config user.name "lines-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          validate() {
            for f in data/lines_nba.json data/lines_nhl.json data/lines_slate.json $(git ls-files --others --modified jobs/lines/state); do
              [ -f "$f" ] || continue
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d, dict) and d" "$f" || {
                echo "::warning::broken $f, not committing it"; git checkout -- "$f" 2>/dev/null || rm -f "$f"; }
            done
          }
          status=0
          for i in 1 2 3; do
            python3 jobs/lines/run.py || status=1
            validate
            git add data/lines_nba.json data/lines_nhl.json data/lines_slate.json jobs/lines/state
            if git diff --cached --quiet; then echo "No changes."; exit $status; fi
            git commit -q -m "Lines data $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin "HEAD:$BR"; then echo "Pushed."; exit $status; fi
            echo "Push rejected (the branch moved); rebuilding on top of it."
            git fetch -q origin "$BR" && git reset -q --hard "origin/$BR" && git clean -fdq jobs/lines/state
            sleep $((i * 5))
          done
          echo "::error::push failed 3 times"; exit 1
